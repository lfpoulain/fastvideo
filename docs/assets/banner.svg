<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">FastVideo — Local vision. Live webcam.</title>
  <desc id="desc">Bannière vert foncé et crème avec une caméra et un flux de données vers un modèle local.</desc>
