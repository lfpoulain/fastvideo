[tool.ruff]
target-version = "py311"
line-length = 100
include = ["app.py", "vision.py", "downloads.py", "interface.py", "tests/**/*.py", "tools/**/*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["app", "vision", "downloads", "interface", "tools"]
